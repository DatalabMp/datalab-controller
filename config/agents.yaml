agents:
  requirements:
    display_name: Requisitos
    can_write: false
    veto: false
    responsibility: definir pergunta de pesquisa, escopo, critérios de aceite e entregáveis
  architecture:
    display_name: Arquitetura
    can_write: false
    veto: true
    responsibility: definir limites, módulos, dependências e desenho de implantação
  data:
    display_name: Dados e Qualidade
    can_write: false
    veto: true
    responsibility: inspecionar esquema, qualidade, transformações, dados ausentes e proveniência
  statistics:
    display_name: Estatística
    can_write: false
    veto: true
    responsibility: validar métodos estatísticos, premissas, incerteza e interpretação
  modeling:
    display_name: Modelagem
    can_write: false
    veto: false
    responsibility: justificar tarefas preditivas, linhas de base, métricas, vazamento e validação
  visualization:
    display_name: Visualização
    can_write: false
    veto: false
    responsibility: projetar visualizações e dashboards fiéis, acessíveis e orientados a perguntas
  qa:
    display_name: Qualidade e Testes
    can_write: false
    veto: true
    responsibility: executar testes, lint, verificações rápidas e validação de casos extremos
  security:
    display_name: Segurança
    can_write: false
    veto: true
    responsibility: aplicar escopo de repositórios, higiene de segredos, segurança de dependências e comandos
  reviewer:
    display_name: Revisor Independente
    can_write: false
    veto: true
    responsibility: realizar verificação crítica independente antes de qualquer liberação
  executor:
    display_name: Executor
    can_write: true
    veto: false
    responsibility: aplicar somente alterações aprovadas e criar commits significativos em português

pipeline:
  - requirements
  - architecture
  - data
  - statistics
  - modeling
  - visualization
  - qa
  - security
  - reviewer
  - executor
