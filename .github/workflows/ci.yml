name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Validar estilo com Ruff
        run: ruff check .

      - name: Executar testes
        run: pytest -q

      - name: Gerar snapshot do controlador
        run: python -m datalab.orchestrator
