name: Publicar Central de Operações

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "config/**"
      - "datalab/**"
      - "state/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar controlador
        run: python -m pip install -e .

      - name: Gerar snapshot de monitoramento
        run: python -m datalab.orchestrator > docs/monitor.json

      - name: Configurar GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Informar necessidade de configuração do Pages
        if: steps.pages.outcome != 'success'
        run: echo "O GitHub Pages ainda não está ativado. Ative uma vez em Configurações > Pages usando GitHub Actions."

      - name: Enviar artefato do Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    if: needs.construir.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: construir
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
