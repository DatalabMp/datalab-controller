name: Fábrica de projetos

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "datalab/project_factory.py"
      - ".github/workflows/project-factory.yml"

permissions:
  contents: write

concurrency:
  group: datalab-project-factory
  cancel-in-progress: false

jobs:
  fabrica:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar controlador
        uses: actions/checkout@v5

      - name: Verificar credenciais
        id: credentials
        env:
          APP_ID: ${{ secrets.DATALAB_APP_ID }}
          PRIVATE_KEY: ${{ secrets.DATALAB_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Fábrica de projetos pausada: as credenciais da GitHub App não estão configuradas."
          fi

      - name: Gerar token da GitHub App para a organização
        if: steps.credentials.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DATALAB_APP_ID }}
          private-key: ${{ secrets.DATALAB_PRIVATE_KEY }}
          owner: DatalabMp

      - name: Configurar Python
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar controlador
        if: steps.credentials.outputs.ready == 'true'
        run: python -m pip install -e .

      - name: Executar fábrica de projetos
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DATALAB_FACTORY_ENABLED: "true"
        run: python -m datalab.project_factory

      - name: Persistir estado do controlador
        if: steps.credentials.outputs.ready == 'true'
        run: |
          git config user.name "Fábrica de Projetos DataLab"
          git config user.email "actions@users.noreply.github.com"
          git add config/projects.yaml state/runtime.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de estado do controlador para persistir."
          else
            git commit -m "operação: inicia próximo projeto gerenciado do DataLab"
            git push
          fi
